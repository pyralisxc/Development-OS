name: eval

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Eval kind
        required: true
        type: choice
        default: behavior
        options: [behavior, trajectory, productive]
      scenario:
        description: Optional scenario id; blank means all eligible scenarios
        required: false
        type: string
permissions:
  contents: read

jobs:
  optional-live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEVOS_OPENAI_MODEL: ${{ vars.DEVOS_OPENAI_MODEL }}
      DEVOS_EVAL_OUTPUT_DIR: artifacts/evals/current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Require explicit live-eval configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is required"; exit 1; }
          test -n "$DEVOS_OPENAI_MODEL" || { echo "DEVOS_OPENAI_MODEL repository variable is required"; exit 1; }
      - name: Run requested eval
        shell: bash
        run: |
          args=(run "${{ inputs.kind }}" --provider openai)
          if [ -n "${{ inputs.scenario }}" ]; then
            args+=(--scenario "${{ inputs.scenario }}")
          fi
          node dist/src/cli.js "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-os-eval-${{ github.run_id }}
          path: artifacts/evals/current
          if-no-files-found: warn
          retention-days: 7
